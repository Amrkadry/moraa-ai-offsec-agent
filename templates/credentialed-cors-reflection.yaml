id: moraa-credentialed-cors-reflection

info:
  name: Credentialed CORS - Arbitrary Attacker Origin Reflected with Allow-Credentials
  author: moraa-ai-offsec-agent
  severity: high
  description: |
    Sends a request with a reserved-TLD attacker Origin and matches ONLY when the server echoes
    that exact origin in Access-Control-Allow-Origin AND sets Access-Control-Allow-Credentials:
    true. That combination lets any script on the attacker origin read the response of a
    victim's credentialed request cross-origin (cookies ride along). A wildcard-200 host or an
    origin reflected WITHOUT credentials does not match.
    IMPACT GATE: per the cors.md rule a credentialed-CORS reflection is a PRECONDITION, not a
    standalone finding - pair it with a proven delivery vector (XSS/subdomain takeover on an
    allowed origin) before reporting. Point the template at a sensitive, authenticated
    endpoint and supply your session with -H "Cookie: ...".
  reference:
    - https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS
  metadata:
    moraa-doc: nuclei-templates.md
    moraa-gate: reflection + delivery vector + victim data in hand, or it stays a lead
  tags: cors,exposure,moraa

http:
  - raw:
      - |
        GET HTTP/1.1
        Host: {{Hostname}}
        Origin: https://attacker.example

    matchers:
      - type: dsl
        dsl:
          - "contains(to_lower(header), 'access-control-allow-origin: https://attacker.example') && contains(to_lower(header), 'access-control-allow-credentials: true')"
